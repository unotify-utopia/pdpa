<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#047857" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Shield Base with Shadow -->
  <path d="M32 4 C18 4, 9 9, 7 14 C7 36, 17 53, 32 60 C47 53, 57 36, 57 14 C55 9, 46 4, 32 4 Z" fill="url(#shieldGrad)" filter="url(#shadow)"/>
  
  <!-- Inner Shield Trim / Rim -->
  <path d="M32 7 C20 7, 12 11, 10 16 C10 35, 18 49, 32 56 C46 49, 54 35, 54 16 C52 11, 44 7, 32 7 Z" fill="none" stroke="url(#goldAccent)" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
  
  <!-- Sleek Cyber/PDPA Lock Emblem in Center -->
  <path d="M32 17 C26.5 17, 22 21.5, 22 27 V30 C20 30, 19 31, 19 33 V43 C19 45.5, 21 47, 23.5 47 H40.5 C43 47, 45 45.5, 45 43 V33 C45 31, 44 30, 42 30 V27 C42 21.5, 37.5 17, 32 17 Z M32 21 C35.3 21, 38 23.7, 38 27 V30 H26 V27 C26 23.7, 28.7 21, 32 21 Z" fill="white" opacity="0.95"/>
  
  <!-- Keyhole / Security Shield Dot inside Lock -->
  <circle cx="32" cy="37" r="2.8" fill="url(#goldAccent)"/>
  <path d="M32 38.5 L30.5 43 H33.5 Z" fill="url(#goldAccent)"/>
</svg>
