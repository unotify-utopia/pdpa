name: 🚀 Auto Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to portal.pdpa.click
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            set -e
            cd /root/pdpa
            echo "⬇️ Pulling latest code..."
            git fetch https://github.com/unotify-utopia/pdpa.git main
            git reset --hard FETCH_HEAD
            echo "📦 Installing dependencies..."
            npm install --legacy-peer-deps
            echo "🔨 Building frontend..."
            npm run build
            echo "🚀 Restarting server and clearing old processes..."
            pm2 delete pdpa-req-system || true
            kill -9 $(lsof -t -i:3001) || true
            pm2 start server.js --name pdpa-req-system --update-env
            echo "✅ Deploy complete!"
