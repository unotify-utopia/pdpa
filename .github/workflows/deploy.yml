name: 🚀 Auto Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to pdpa.numcomputer.com
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Frontend (Vite + TypeScript)
        run: npm run build

      - name: 📤 Copy built files to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "dist/,server.js,package.json,package-lock.json,ecosystem.config.cjs"
          target: ${{ secrets.APP_PATH }}

      - name: ♻️ Restart server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            cd ${{ secrets.APP_PATH }}
            echo "📦 Installing production dependencies..."
            npm install --omit=dev
            echo "♻️ Restarting PM2..."
            pm2 restart pdpa-req-system
            echo "✅ Deploy complete!"

